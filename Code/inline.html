<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroCity</title>
  <style>
    /* ===== CSS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #c8e6c9;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(to right, #4caf50, #81c784);
      color: white;
    }

    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: white;
      color: #2e7d32;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #c8e6c9;
      color: #1b5e20;
    }

    footer {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  
  <header>
    <h1>AgroCity</h1>
    <nav>
      <a href="#">Início</a>
      <a href="#">Sobre</a>
      <a href="#">Serviços</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Conectando o campo à cidade</h2>
    <p>Transformando a agricultura com tecnologia e inovação.</p>
    <a href="#" class="btn">Saiba mais</a>
  </section>

  <footer>
    <p>&copy; 2025 AgroCity - Todos os direitos reservados</p>
  </footer>

  <script>
    // ===== JS =====
    document.addEventListener("DOMContentLoaded", () => {
      const button = document.querySelector(".btn");
      if (button) {
        button.addEventListener("click", () => {
          alert("Em breve você poderá acessar mais informações sobre os serviços da AgroCity!");
        });
      }
    });
  </script>
</body>
</html>
